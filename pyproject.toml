[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regrag"
version = "0.1.0"
description = "Retrieval-augmented generation over German financial-regulatory texts, with retrieval evaluation as the primary object of study"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.3.0",
    "faiss-cpu>=1.9.0",
    "anthropic>=0.40.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
