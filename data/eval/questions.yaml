# Labelled evaluation set.
#
# This file is the most valuable artefact in the repository: it is hand-made, it is what
# makes every metric possible, and it cannot be generated automatically without circularity.
#
# Each entry records a question, the passage that actually answers it, and whether the
# corpus contains an answer at all. The `answerable: false` entries are deliberate --
# they are how abstention gets measured. A system that never abstains scores zero on them.
#
# Fields:
#   id            stable identifier (a = answerable, u = unanswerable)
#   question      the query, phrased as a practitioner would ask it
#   answerable    whether the corpus contains the answer
#   source_doc    filename of the document that must contain the answer; null if the passage
#                 is expected in every version of the circular (any document then counts).
#                 Set it whenever the question is about a version-specific wording.
#   gold_section  section the answer is expected in -- used for error analysis only
#                 ("right section, wrong chunk"), never for relevance
#   gold_span     a short verbatim quote from the passage that answers it, or a list of quotes
#                 if the answer needs several passages (null if unanswerable). Relevance is
#                 decided by this text alone, so the same labels score every chunking strategy.
#   note          why this question is interesting -- ambiguity, near-duplicate, edge case
#
# Spans are matched after normalisation (case, whitespace, hyphenation, quote characters),
# not character for character. Before any metric is trusted, every span is checked against
# the extracted corpus:
#     python scripts/check_questions.py
# A span reported as PARTIAL or MISSING is corrected by copying the wording it prints.

# --- Answerable -------------------------------------------------------------

- id: a01
