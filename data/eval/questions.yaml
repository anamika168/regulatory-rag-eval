  source_doc: null
  gold_section: "AT 3"
  gold_span: "unabhängig von der internen Zuständigkeitsregelung, für die ordnungsgemäße Geschäftsorganisation"
  note: "Answer is all Geschäftsleiter jointly. The passage cites § 1 Abs. 2 KWG inside the sentence -- a test of the hypothesis that § is a citation, not a boundary."

